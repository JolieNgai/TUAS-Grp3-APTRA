<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Light mode version -->
  <g class="logo-light" style="display: block;">
    <!-- Outer circle -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- A letter -->
    <path d="M 12 28 L 20 10 L 28 28" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
    <!-- Horizontal bar of A -->
    <line x1="14" y1="21" x2="26" y2="21" stroke="#1a1a1a" stroke-width="2"/>
  </g>
  
  <!-- Dark mode version (will be toggled via CSS or JavaScript) -->
  <style>
    @media (prefers-color-scheme: dark) {
      .logo-light { display: none; }
      .logo-dark { display: block; }
    }
    
    body.dark-mode .logo-light { display: none; }
    body.dark-mode .logo-dark { display: block; }
  </style>
  
  <g class="logo-dark" style="display: none;">
    <!-- Outer circle -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="#d4af7c" stroke-width="1.5"/>
    <!-- A letter -->
    <path d="M 12 28 L 20 10 L 28 28" fill="none" stroke="#d4af7c" stroke-width="2" stroke-linejoin="round"/>
    <!-- Horizontal bar of A -->
    <line x1="14" y1="21" x2="26" y2="21" stroke="#d4af7c" stroke-width="2"/>
  </g>
</svg>